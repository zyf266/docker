# 正式机 Nginx 443 server 内「建议」location 片段
# 用法：备份现网 conf → 人工合并本片段 → nginx -t → systemctl reload nginx
#
# 禁止用脚本直接覆盖 /etc/nginx/...
#
# 备份示例:
#   cp -a /etc/nginx/conf.d/xxx.conf /etc/nginx/conf.d/xxx.conf.bak.$(date +%Y%m%d%H%M)
#
# 要点:
# - / 与 /api/ 均反代到 Compose api :8100（废弃原 8050 静态目录）
# - TradingView webhook 仍走 :8005
# - 不要改动 80 端口 mulonghk.com 等其它站点

# --- 合并到 listen 443 的 server { } 内 ---

location /api/ {
    proxy_pass http://127.0.0.1:8100/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
}

# 前端由 api 容器静态资源提供（替代原 root / proxy 8050）
location / {
    proxy_pass http://127.0.0.1:8100/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
}

location /webhook {
    proxy_pass http://127.0.0.1:8005/webhook;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 120s;
}

