name: Deploy to Test ECS

# 测试机 39.106.143.222 — push main 或手动触发
# Secrets: SSH_HOST / SSH_USER / SSH_PRIVATE_KEY / SSH_PORT
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ecs-test
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Syntax-check scripts
        run: |
          bash -n deploy/remote-ci.sh
          bash -n deploy/deploy.sh
          bash -n deploy/install-docker.sh
          bash -n deploy/bootstrap-prod-47.sh
          bash -n deploy/verify-prod.sh

      - name: Pack source
        run: |
          set -euo pipefail
          tar -czf /tmp/backpack-quant.tgz \
            --exclude='./.git' \
            --exclude='./node_modules' \
            --exclude='./backpack_quant_trading/frontend/node_modules' \
            --exclude='*/__pycache__' \
            --exclude='*.pyc' \
            --exclude='./.env' \
            --exclude='./.env.secrets' \
            --exclude='./backpack_quant_trading/log' \
            --exclude='./backpack_quant_trading/data/chroma_score_feedback' \
            --exclude='./backpack_quant_trading/data/kline_cache' \
            --exclude='./log' \
            --exclude='./.cursor' \
            --exclude='./.idea' \
            --exclude='./.vscode' \
            -C "${GITHUB_WORKSPACE}" .
          cp /tmp/backpack-quant.tgz "${GITHUB_WORKSPACE}/backpack-quant.tgz"
          ls -lh "${GITHUB_WORKSPACE}/backpack-quant.tgz"

      - name: Upload package
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          source: "backpack-quant.tgz"
          target: "/tmp/"
          overwrite: true
          timeout: 120s
          command_timeout: 15m

      - name: Install and start on Test ECS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          debug: true
          command_timeout: 45m
          script_stop: true
          script_path: deploy/remote-ci.sh
          envs: SKIP_MYSQL
        env:
          SKIP_MYSQL: "0"
