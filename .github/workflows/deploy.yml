name: Deploy to ECS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ecs
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      # 脚本在 Runner 上检出后经 SSH 下发执行，避免在 YAML 里写复杂 bash（易被 ssh-action 拆行解析报错）
      - name: Checkout
        uses: actions/checkout@v4

      - name: Syntax-check remote script
        run: bash -n deploy/remote-ci.sh && bash -n deploy/deploy.sh && bash -n deploy/install-docker.sh

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          debug: true
          command_timeout: 40m
          script_stop: true
          script_path: deploy/remote-ci.sh
