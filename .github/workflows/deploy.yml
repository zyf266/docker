name: Deploy to ECS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-ecs
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          debug: true
          command_timeout: 40m
          script_stop: true
          script: |
            set -euo pipefail
            APP_DIR="/opt/backpack-quant"
            REPO="https://github.com/zyf266/docker.git"
            BRANCH="main"

            if [ ! -d "${APP_DIR}/.git" ]; then
              echo "==> 首次部署：安装 git、克隆仓库..."
              if command -v dnf &>/dev/null; then dnf install -y git curl openssl 2>/dev/null || true; fi
              if command -v yum &>/dev/null; then yum install -y git curl openssl 2>/dev/null || true; fi

              # 先克隆，再用仓库里的国内镜像脚本装 Docker（避免 get.docker.com SSL 失败）
              git clone -b "${BRANCH}" "${REPO}" "${APP_DIR}"
              chmod +x "${APP_DIR}/deploy/install-docker.sh" "${APP_DIR}/deploy/deploy.sh" "${APP_DIR}/deploy/entrypoint.sh"
              bash "${APP_DIR}/deploy/install-docker.sh"

              cd "${APP_DIR}"
              cp deploy/env.example .env
              DB_PASS=$(openssl rand -base64 24 | tr -dc 'a-zA-Z0-9' | head -c 24)
              sed -i "s/请修改为强密码/${DB_PASS}/" .env
            else
              # 已有仓库时，若缺 Docker 也补装
              if ! command -v docker &>/dev/null; then
                chmod +x "${APP_DIR}/deploy/install-docker.sh"
                bash "${APP_DIR}/deploy/install-docker.sh"
              fi
            fi

            bash "${APP_DIR}/deploy/deploy.sh"
