name: Deploy to Prod ECS

# 正式机 47.110.57.118 — 仅手动触发，避免误推
# 这是正式服唯一允许的更新路径（禁止 docker cp / hotfix 热更）。
# 详见 docs/deploy-policy-no-hotfix.md
# Secrets: SSH_HOST_PROD / SSH_USER_PROD / SSH_PRIVATE_KEY_PROD / SSH_PORT_PROD
on:
  workflow_dispatch:

concurrency:
  group: deploy-ecs-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Syntax-check scripts
        run: |
          bash -n deploy/remote-ci.sh
          bash -n deploy/deploy.sh
          bash -n deploy/build-frontend.sh
          bash -n deploy/install-docker.sh
          bash -n deploy/bootstrap-prod-47.sh
          bash -n deploy/verify-prod.sh

      # 在 Actions（大内存）构建前端；禁止在小内存 ECS 内 npm（会 OOM）
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: backpack_quant_trading/frontend/package-lock.json

      - name: Build frontend dist
        run: bash deploy/build-frontend.sh

      - name: Pack source
        run: |
          set -euo pipefail
          test -f backpack_quant_trading/frontend/dist/index.html
          tar -czf /tmp/backpack-quant.tgz \
            --exclude='./.git' \
            --exclude='./node_modules' \
            --exclude='./backpack_quant_trading/frontend/node_modules' \
            --exclude='*/__pycache__' \
            --exclude='*.pyc' \
            --exclude='./.env' \
            --exclude='./.env.secrets' \
            --exclude='./backpack_quant_trading/log' \
            --exclude='./backpack_quant_trading/data/chroma_score_feedback' \
            --exclude='./backpack_quant_trading/data/kline_cache' \
            --exclude='./log' \
            --exclude='./.cursor' \
            --exclude='./.idea' \
            --exclude='./.vscode' \
            -C "${GITHUB_WORKSPACE}" .
          cp /tmp/backpack-quant.tgz "${GITHUB_WORKSPACE}/backpack-quant.tgz"
          ls -lh "${GITHUB_WORKSPACE}/backpack-quant.tgz"
          tar -tzf "${GITHUB_WORKSPACE}/backpack-quant.tgz" | grep -F 'frontend/dist/index.html'

      - name: Upload package
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST_PROD }}
          username: ${{ secrets.SSH_USER_PROD }}
          key: ${{ secrets.SSH_PRIVATE_KEY_PROD }}
          port: ${{ secrets.SSH_PORT_PROD || 22 }}
          source: "backpack-quant.tgz"
          target: "/tmp/"
          overwrite: true
          timeout: 120s
          command_timeout: 15m

      - name: Install and start on Prod ECS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST_PROD }}
          username: ${{ secrets.SSH_USER_PROD }}
          key: ${{ secrets.SSH_PRIVATE_KEY_PROD }}
          port: ${{ secrets.SSH_PORT_PROD || 22 }}
          debug: true
          command_timeout: 45m
          script_stop: true
          script_path: deploy/remote-ci.sh
          envs: SKIP_MYSQL,DEPLOY_ENV
        env:
          SKIP_MYSQL: "1"
          DEPLOY_ENV: prod
